aid: amplifymd
name: AmplifyMD
description: AmplifyMD is a virtual care platform for hospitals and health systems, providing a nationwide
  network of remote specialists across more than 15 essential fields. It powers telemedicine across emergent,
  inpatient, asynchronous, SNF/LTAC, virtual clinic, and direct-to-patient care models, and integrates
  with major EHR systems including Epic, Oracle Health, athenahealth, Allscripts, eClinicalWorks, NextGen,
  TruBridge, and MedHost to help organizations build sustainable clinical staffing models. Backed by Forerunner
  Ventures.
